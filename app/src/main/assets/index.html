<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Triage</title>
<style>
  :root {
    --paper:#f0f2f5; --surface:#ffffff; --ink:#111b21; --muted:#667781;
    --line:#e9edef; --chip:#eff2f5; --hover:#f5f6f6;
    --green:#25d366; --green-deep:#008069; --green-soft:#d9fdd3;
    --radius:10px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper:#0b141a; --surface:#111b21; --ink:#e9edef; --muted:#8696a0;
      --line:#222d34; --chip:#202c33; --hover:#182229;
      --green:#00a884; --green-deep:#00a884; --green-soft:#103529;
    }
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0;
    background: var(--surface);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 16px; line-height: 1.4;
    padding-bottom: env(safe-area-inset-bottom);
  }

  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--green-deep); outline-offset: 2px; }

  /* ---------- en-tete + onglets ---------- */
  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    padding-top: env(safe-area-inset-top);
  }
  .bar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px 8px;
  }
  .bar h1 { margin: 0; font-size: 21px; font-weight: 700; color: var(--green-deep); letter-spacing: -0.01em; }
  .bar button { font-size: 14px; font-weight: 600; color: var(--green-deep); }

  .tabs {
    display: flex; gap: 8px; overflow-x: auto;
    padding: 4px 12px 10px; scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }

  .tab {
    flex: 0 0 auto; display: flex; align-items: center; gap: 6px;
    padding: 6px 13px; border-radius: 16px;
    background: var(--chip); color: var(--muted); font-size: 14px;
  }
  .tab[aria-selected="true"] { background: var(--green-soft); color: var(--green-deep); font-weight: 600; }
  .tab-sep { flex: 0 0 auto; align-self: center; color: var(--muted); opacity: .5; font-weight: 700; font-size: 18px; padding: 0 1px; user-select: none; }

  .count {
    min-width: 18px; height: 18px; padding: 0 5px;
    border-radius: 9px; font-size: 11px; font-weight: 700;
    display: grid; place-items: center;
  }
  .count.on  { background: var(--green); color: #fff; }
  .count.off { background: transparent; color: var(--muted); border: 1px solid var(--line); }

  /* ---------- liste facon WhatsApp ---------- */
  main { padding: 0 0 90px; }

  .row {
    display: flex; gap: 13px; align-items: center;
    width: 100%; text-align: left;
    background: var(--surface);
    padding: 9px 14px;
    border-bottom: 1px solid var(--line);
  }
  .row:active { background: var(--hover); }

  .avatar {
    width: 49px; height: 49px; border-radius: 50%; flex: 0 0 auto;
    display: grid; place-items: center;
    color: #fff; font-weight: 600; font-size: 18px;
  }

  .row-main { flex: 1; min-width: 0; }
  .name {
    font-weight: 500; font-size: 17px; color: var(--ink);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .unread .name { font-weight: 600; }
  .preview {
    font-size: 14.5px; color: var(--muted); margin-top: 3px;
    display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden;
  }

  .meta { display: flex; flex-direction: column; align-items: flex-end; gap: 7px; flex: 0 0 auto; }
  .time { font-size: 12px; color: var(--muted); }
  .unread .time { color: var(--green); font-weight: 600; }

  .badge-green {
    min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px;
    background: var(--green); color: #fff; font-size: 12px; font-weight: 700;
    display: grid; place-items: center;
  }

  .add-btn {
    width: 30px; height: 30px; border-radius: 50%;
    background: var(--chip); color: var(--green-deep);
    font-size: 21px; line-height: 1; display: grid; place-items: center;
  }
  .add-btn:active { background: var(--line); }

  .tag {
    font-size: 11px; font-weight: 600; color: #fff;
    padding: 1px 7px; border-radius: 9px; display: inline-block;
  }

  /* ---------- etats vides / reglages ---------- */
  .panel { background: var(--surface); border-radius: var(--radius); padding: 22px 18px; margin: 12px; }
  .panel h2 { margin: 0 0 8px; font-size: 17px; font-weight: 600; }
  .panel p { margin: 0 0 14px; color: var(--muted); font-size: 15px; }

  .action { background: var(--green-deep); color: #fff; padding: 11px 16px; border-radius: 22px; font-weight: 600; font-size: 15px; }
  .action.ghost { background: var(--chip); color: var(--ink); }

  .field { width: 100%; padding: 10px 12px; margin-bottom: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); }

  .list-edit { border-top: 1px solid var(--line); padding: 16px 0 4px; }
  .list-edit:first-of-type { border-top: 0; }
  .swatches { display: flex; gap: 8px; margin: 10px 0 12px; }
  .swatch { width: 26px; height: 26px; border-radius: 50%; border: 2px solid transparent; }
  .swatch[aria-pressed="true"] { border-color: var(--ink); }
  .subhead { font-size: 13px; font-weight: 600; color: var(--muted); margin: 14px 0 2px; text-transform: uppercase; letter-spacing: .03em; }

  .pick-wrap { max-height: 42vh; overflow: auto; margin: 4px 0 8px; border: 1px solid var(--line); border-radius: 8px; }
  .pick { display: flex; align-items: center; gap: 11px; width: 100%; text-align: left; padding: 11px 12px; border-top: 1px solid var(--line); }
  .pick:first-child { border-top: 0; }
  .pick .box { width: 22px; height: 22px; flex: 0 0 auto; border: 2px solid var(--line); border-radius: 6px; display: grid; place-items: center; font-size: 14px; color: #fff; }
  .pick[aria-pressed="true"] .box { background: var(--green-deep); border-color: var(--green-deep); }
  .pick .pname { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
  .pick-empty { color: var(--muted); font-size: 14px; padding: 12px; }

  .sheet-bg { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; }
  .sheet { width: 100%; background: var(--surface); border-radius: 16px 16px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); max-height: 80vh; overflow: auto; }
  .sheet h3 { margin: 0 0 6px; font-size: 16px; font-weight: 600; }
  .sheet .opt { display: flex; align-items: center; gap: 11px; width: 100%; text-align: left; padding: 13px 6px; border-top: 1px solid var(--line); font-size: 16px; color: var(--ink); }
  .sheet .opt:active { background: var(--hover); }
  .swatch-dot { width: 14px; height: 14px; border-radius: 50%; flex: 0 0 auto; }
</style>
</head>
<body>

<header>
  <div class="bar">
    <h1 id="screen-title">Triage</h1>
    <button id="toggle-settings">Listes</button>
  </div>
  <div class="tabs" id="tabs" role="tablist"></div>
</header>

<main id="main"></main>

<script>
/* ------------------------------------------------------------------ */
/* Pont natif                                                          */
/* ------------------------------------------------------------------ */

/* Sur le telephone, Android expose window.AndroidBridge.
   Dans un navigateur, on bascule sur des conversations factices pour
   pouvoir travailler l'interface sans reinstaller l'APK. */

const Bridge = window.AndroidBridge ? {
  isEnabled:     () => AndroidBridge.isEnabled(),
  openSettings:  () => AndroidBridge.openSettings(),
  getMessages:   () => JSON.parse(AndroidBridge.getMessages() || '[]'),
  clearMessages: () => AndroidBridge.clearMessages(),
  openChat:      p  => AndroidBridge.openChat(p || '')
} : demoBridge();

function demoBridge() {
  const now = Date.now(), min = 60000;
  const messages = [
    { id:'1', conversation:'Marie Lambert',   sender:'Marie Lambert',   text:"Bonjour, oui je suis interessee, on peut en parler ?", isGroup:false, postTime: now - 4*min },
    { id:'2', conversation:'Antoine Ferrand', sender:'Antoine Ferrand', text:'Pas disponible avant la semaine prochaine',            isGroup:false, postTime: now - 41*min },
    { id:'3', conversation:'Famille',         sender:'Papa',            text:'On vous attend dimanche midi',                         isGroup:true,  postTime: now - 92*min },
    { id:'4', conversation:'Sophie Renaud',   sender:'Sophie Renaud',   text:'Vous pouvez me renvoyer le document ?',                isGroup:false, postTime: now - 180*min },
    { id:'5', conversation:'Asso Rando',      sender:'Claire',          text:'Sortie annulee, trop de pluie annoncee',               isGroup:true,  postTime: now - 1560*min },
    { id:'6', conversation:'Karim Belaid',    sender:'Karim Belaid',    text:'Merci pour votre message',                             isGroup:false, postTime: now - 1800*min }
  ];
  return {
    isEnabled:     () => true,
    openSettings:  () => {},
    getMessages:   () => messages,
    clearMessages: () => { messages.length = 0; },
    openChat:      p  => alert(p ? 'Ouvrirait WhatsApp sur ' + p : 'Ouvrirait WhatsApp')
  };
}

/* ------------------------------------------------------------------ */
/* Etat                                                                */
/* ------------------------------------------------------------------ */

const COLORS = ['#2f6fed', '#0f8a5f', '#b4471f', '#7b4bc4', '#0f7b8a', '#9c6b1f'];

const defaults = {
  lists: [],
  seen: {},   // conversation -> timestamp du dernier message consulte
  phones: {}  // conversation -> numero international
};

const config = load();
let messages = [];
let active = 'unread';      // on arrive toujours sur les non-lus
let settingsOpen = false;

function load() {
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem('triage') || '{}'); } catch {}

  // Migration depuis l'ancienne version (dossiers a mots-cles -> listes manuelles).
  if (!saved.lists && Array.isArray(saved.folders)) {
    saved.lists = saved.folders.map(f => ({
      id: f.id, name: f.name, color: f.color, members: []
    }));
  }
  delete saved.folders;
  delete saved.defaultFolder;

  const cfg = { ...defaults, ...saved };
  if (!Array.isArray(cfg.lists)) cfg.lists = defaults.lists.map(l => ({ ...l }));
  cfg.lists.forEach(l => { if (!Array.isArray(l.members)) l.members = []; });
  cfg.seen = cfg.seen || {};
  cfg.phones = cfg.phones || {};
  return cfg;
}
function save() {
  localStorage.setItem('triage', JSON.stringify(config));
}

/* ------------------------------------------------------------------ */
/* Regroupement des notifications en conversations                     */
/* ------------------------------------------------------------------ */

function conversations() {
  const byName = new Map();
  for (const m of messages) {
    const current = byName.get(m.conversation);
    if (!current || m.postTime > current.postTime) {
      byName.set(m.conversation, m);
    }
  }
  return [...byName.values()].sort((a, b) => b.postTime - a.postTime);
}

/* Une entree de config.lists peut etre un vrai onglet ou un separateur "|". */
function isSeparator(l) {
  return l.separator === true || String(l.name).trim() === '|';
}
function listsOf(name) {
  return config.lists.filter(l => !isSeparator(l) && l.members.includes(name));
}
function primaryList(name) {
  return listsOf(name)[0] || null;
}
function inAnyList(name) {
  return config.lists.some(l => !isSeparator(l) && l.members.includes(name));
}

function isUnread(c) {
  return c.postTime > (config.seen[c.conversation] || 0);
}

/* Nombre de messages non lus d'une conversation (pour la pastille verte). */
function unreadCount(c) {
  const s = config.seen[c.conversation] || 0;
  return messages.filter(m => m.conversation === c.conversation && m.postTime > s).length;
}

/* Avatar : initiales + couleur derivee du nom. */
const AVATAR_COLORS = ['#e17076','#7bc862','#65aadd','#a695e7','#ee7aae','#6ec9cb','#f2a25c','#d98c8c'];
function initials(name) {
  const parts = String(name).trim().split(/\s+/).filter(Boolean);
  if (!parts.length) return '?';
  let s = parts[0][0] || '';
  if (parts.length > 1) s += parts[1][0] || '';
  return s.toUpperCase();
}
function avatarColor(name) {
  let h = 0;
  for (const ch of String(name)) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return AVATAR_COLORS[h % AVATAR_COLORS.length];
}

/* ------------------------------------------------------------------ */
/* Rendu                                                               */
/* ------------------------------------------------------------------ */

function normalizeActive() {
  if (active === 'unread') return;
  const all = conversations();
  if (active === 'unsorted') {
    const has = all.some(c => !c.isGroup && !inAnyList(c.conversation));
    if (!has) active = 'unread';
    return;
  }
  // Un onglet de liste doit exister et ne pas etre un separateur.
  const l = config.lists.find(x => x.id === active && !isSeparator(x));
  if (!l) active = 'unread';
}

function render() {
  normalizeActive();
  renderTabs();
  document.getElementById('main').innerHTML = '';
  if (settingsOpen) return renderSettings();
  renderList();
}

function makeTab(id, label, unread, total) {
  const btn = document.createElement('button');
  btn.className = 'tab';
  btn.role = 'tab';
  btn.setAttribute('aria-selected', active === id);
  btn.innerHTML = `<span>${escape(label)}</span>`;
  if (total > 0) {
    const badge = document.createElement('span');
    // Noir avec le nombre de non-lus s'il y en a ; sinon gris clair avec le total.
    badge.className = 'count ' + (unread > 0 ? 'on' : 'off');
    const n = unread > 0 ? unread : total;
    badge.textContent = n > 99 ? '99+' : n;
    btn.append(badge);
  }
  btn.onclick = () => { active = id; render(); };
  return btn;
}

function renderTabs() {
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = '';
  if (settingsOpen) { tabs.style.display = 'none'; return; }
  tabs.style.display = 'flex';

  const all = conversations();
  const unreadAll = all.filter(isUnread).length;

  // Non lus (vue par defaut) : pastille = nombre de non-lus
  tabs.append(makeTab('unread', 'Non lus', unreadAll, unreadAll));

  // Listes editables et separateurs "|"
  for (const l of config.lists) {
    if (isSeparator(l)) {
      const sep = document.createElement('span');
      sep.className = 'tab-sep';
      sep.textContent = '|';
      sep.setAttribute('aria-hidden', 'true');
      tabs.append(sep);
      continue;
    }
    const inList = all.filter(c => l.members.includes(c.conversation));
    const unread = inList.filter(isUnread).length;
    tabs.append(makeTab(l.id, l.name, unread, inList.length));
  }

  // A classer : contacts directs non ranges — masque si tout est classe
  const unsorted = all.filter(c => !c.isGroup && !inAnyList(c.conversation));
  if (unsorted.length > 0) {
    const unsortedUnread = unsorted.filter(isUnread).length;
    tabs.append(makeTab('unsorted', 'A classer', unsortedUnread, unsorted.length));
  }
}

function renderList() {
  const main = document.getElementById('main');
  const all = conversations();
  const rows = all.filter(c => {
    if (active === 'unread')   return isUnread(c);
    if (active === 'unsorted') return !c.isGroup && !inAnyList(c.conversation);
    const l = config.lists.find(x => x.id === active);
    return l ? l.members.includes(c.conversation) : false;
  });

  if (!rows.length) {
    let msg;
    if (active === 'unread') {
      msg = "Aucun message non lu. Une discussion revient ici des qu'un nouveau message arrive, et disparait une fois lue.";
    } else if (active === 'unsorted') {
      msg = "Aucun contact direct pour l'instant. Un contact s'ajoute ici des qu'il t'ecrit ; range-le ensuite dans une liste.";
    } else {
      msg = "Rien ici pour l'instant. Ajoute des discussions a cette liste depuis le bouton Listes.";
    }
    main.innerHTML = `<div class="panel"><h2>Rien a afficher</h2><p>${msg}</p></div>`;
    return;
  }

  for (const c of rows) {
    const unread = isUnread(c);
    const row = document.createElement('div');
    row.className = 'row' + (unread ? ' unread' : '');

    // Avatar rond avec initiales
    const av = document.createElement('div');
    av.className = 'avatar';
    av.style.background = avatarColor(c.conversation);
    av.textContent = initials(c.conversation);
    av.onclick = () => { if (c.isGroup) open(c); else openNumberSheet(c); };

    // Colonne centrale (cliquable)
    const col = document.createElement('div');
    col.className = 'row-main';
    let tags = '';
    if (active === 'unread') {
      tags = listsOf(c.conversation)
        .map(l => `<span class="tag" style="background:${l.color}">${escape(l.name)}</span>`)
        .join(' ');
    }
    col.innerHTML = `
      <div class="name">${escape(c.conversation)}</div>
      <div class="preview">${escape(c.isGroup ? c.sender + ' : ' + c.text : c.text)}</div>
      ${tags ? '<div style="margin-top:5px">' + tags + '</div>' : ''}`;
    col.onclick = () => open(c);

    // Colonne de droite : heure + pastille verte OU bouton "+"
    const meta = document.createElement('div');
    meta.className = 'meta';
    const time = document.createElement('div');
    time.className = 'time';
    time.textContent = clock(c.postTime);
    meta.append(time);

    if (active === 'unread' && !inAnyList(c.conversation)) {
      const add = document.createElement('button');
      add.className = 'add-btn';
      add.textContent = '+';
      add.setAttribute('aria-label', 'Ranger dans une liste');
      add.onclick = (e) => { e.stopPropagation(); openAssignSheet(c.conversation); };
      meta.append(add);
    } else if (unread) {
      const n = unreadCount(c) || 1;
      const badge = document.createElement('div');
      badge.className = 'badge-green';
      badge.textContent = n > 99 ? '99+' : n;
      meta.append(badge);
    }

    row.append(av, col, meta);
    main.append(row);
  }
}

/* ------------------------------------------------------------------ */
/* Feuille : ranger une discussion dans une liste (raccourci)          */
/* ------------------------------------------------------------------ */

function openAssignSheet(name) {
  const bg = document.createElement('div');
  bg.className = 'sheet-bg';
  bg.onclick = (e) => { if (e.target === bg) bg.remove(); };

  const sheet = document.createElement('div');
  sheet.className = 'sheet';

  const h = document.createElement('h3');
  h.textContent = 'Ranger ' + name + ' dans…';
  sheet.append(h);

  for (const l of config.lists) {
    if (isSeparator(l)) continue;
    const already = l.members.includes(name);
    const opt = document.createElement('button');
    opt.className = 'opt';
    opt.innerHTML =
      `<span class="swatch-dot" style="background:${l.color}"></span>` +
      `<span style="flex:1">${escape(l.name)}</span>` +
      (already ? '&#10003;' : '');
    opt.onclick = () => {
      if (!l.members.includes(name)) l.members.push(name);
      save(); bg.remove(); render();
    };
    sheet.append(opt);
  }

  const create = document.createElement('button');
  create.className = 'opt';
  create.innerHTML =
    `<span class="swatch-dot" style="background:var(--ink)"></span>` +
    `<span style="flex:1">Nouvelle liste…</span>`;
  create.onclick = () => {
    bg.remove();
    inputSheet({
      title: 'Nouvelle liste',
      hint: 'Donne un nom a la liste (modifiable ensuite).',
      confirm: 'Creer',
      onConfirm: (v) => {
        if (v && v.trim()) {
          config.lists.push({
            id: 'f' + Date.now(),
            name: v.trim(),
            color: COLORS[config.lists.length % COLORS.length],
            members: [name]
          });
          save(); render();
        }
      }
    });
  };
  sheet.append(create);

  const cancel = document.createElement('button');
  cancel.className = 'opt';
  cancel.style.color = 'var(--muted)';
  cancel.innerHTML =
    `<span class="swatch-dot" style="background:transparent"></span>` +
    `<span style="flex:1">Annuler</span>`;
  cancel.onclick = () => bg.remove();
  sheet.append(cancel);

  bg.append(sheet);
  document.body.append(bg);
}

/* ------------------------------------------------------------------ */
/* Reglages : listes editables + choix des discussions                 */
/* ------------------------------------------------------------------ */

function renderSettings() {
  const main = document.getElementById('main');
  const panel = document.createElement('div');
  panel.className = 'panel';
  panel.innerHTML = `<h2>Tes listes</h2>
    <p>Cree des listes et coche les discussions a y mettre. Seules les discussions deja recues apparaissent (l'app ne peut pas lire ton historique WhatsApp).</p>`;

  const all = conversations();

  // Petites fleches pour reordonner une entree (liste ou separateur).
  const moveButtons = (l) => {
    const i = config.lists.indexOf(l);
    const box = document.createElement('div');
    box.className = 'sheet-actions';
    const up = document.createElement('button');
    up.className = 'action ghost';
    up.textContent = '↑';
    up.disabled = i <= 0;
    up.onclick = () => {
      if (i > 0) { const t = config.lists[i-1]; config.lists[i-1] = l; config.lists[i] = t; save(); renderSettings(); }
    };
    const down = document.createElement('button');
    down.className = 'action ghost';
    down.textContent = '↓';
    down.disabled = i >= config.lists.length - 1;
    down.onclick = () => {
      if (i < config.lists.length - 1) { const t = config.lists[i+1]; config.lists[i+1] = l; config.lists[i] = t; save(); renderSettings(); }
    };
    box.append(up, down);
    return box;
  };

  for (const l of config.lists) {
    const block = document.createElement('div');
    block.className = 'list-edit';

    // --- separateur "|" : bloc minimal ---
    if (isSeparator(l)) {
      const lab = document.createElement('div');
      lab.className = 'subhead';
      lab.style.margin = '4px 0 10px';
      lab.textContent = 'Separateur  |';

      const del = document.createElement('button');
      del.className = 'action ghost';
      del.textContent = 'Supprimer le separateur';
      del.onclick = () => {
        config.lists = config.lists.filter(x => x.id !== l.id);
        save(); renderSettings();
      };
      const actions = document.createElement('div');
      actions.className = 'sheet-actions';
      actions.append(del);

      block.append(lab, moveButtons(l), actions);
      panel.append(block);
      continue;
    }

    const name = document.createElement('input');
    name.className = 'field';
    name.value = l.name;
    name.setAttribute('aria-label', 'Nom de la liste');
    name.oninput = () => { l.name = name.value; save(); renderTabs(); };

    const swatches = document.createElement('div');
    swatches.className = 'swatches';
    for (const color of COLORS) {
      const s = document.createElement('button');
      s.className = 'swatch';
      s.style.background = color;
      s.setAttribute('aria-pressed', l.color === color);
      s.setAttribute('aria-label', 'Couleur ' + color);
      s.onclick = () => { l.color = color; save(); render(); };
      swatches.append(s);
    }

    const sub = document.createElement('div');
    sub.className = 'subhead';
    sub.textContent = 'Discussions dans cette liste';

    const wrap = document.createElement('div');
    wrap.className = 'pick-wrap';
    if (!all.length) {
      wrap.innerHTML = `<div class="pick-empty">Aucune discussion captee pour l'instant. Elles s'ajouteront ici des qu'un message arrivera.</div>`;
    } else {
      for (const c of all) {
        const inList = l.members.includes(c.conversation);
        const item = document.createElement('button');
        item.className = 'pick';
        item.setAttribute('aria-pressed', inList);
        item.innerHTML = `<span class="box">${inList ? '&#10003;' : ''}</span><span class="pname">${escape(c.conversation)}</span>`;
        item.onclick = () => {
          if (l.members.includes(c.conversation)) {
            l.members = l.members.filter(n => n !== c.conversation);
          } else {
            l.members.push(c.conversation);
          }
          save();
          renderSettings();
        };
        wrap.append(item);
      }
    }

    const del = document.createElement('button');
    del.className = 'action ghost';
    del.textContent = 'Supprimer cette liste';
    del.onclick = () => {
      config.lists = config.lists.filter(x => x.id !== l.id);
      if (active === l.id) active = 'unread';
      save(); renderSettings();
    };

    const actions = document.createElement('div');
    actions.className = 'sheet-actions';
    actions.append(del);

    block.append(name, swatches, sub, wrap, moveButtons(l), actions);
    panel.append(block);
  }

  const add = document.createElement('button');
  add.className = 'action';
  add.textContent = 'Nouvelle liste';
  add.style.marginTop = '18px';
  add.onclick = () => {
    config.lists.push({
      id: 'f' + Date.now(),
      name: 'Sans nom',
      color: COLORS[config.lists.length % COLORS.length],
      members: []
    });
    save(); renderSettings();
  };

  const addSep = document.createElement('button');
  addSep.className = 'action ghost';
  addSep.textContent = 'Ajouter un separateur  |';
  addSep.style.marginTop = '8px';
  addSep.onclick = () => {
    config.lists.push({ id: 's' + Date.now(), name: '|', separator: true, members: [] });
    save(); renderSettings();
  };

  panel.append(add, addSep);
  main.append(panel);
}

/* ------------------------------------------------------------------ */
/* Feuille de saisie generique (numero, nom de liste…)                 */
/* ------------------------------------------------------------------ */

function inputSheet(opts) {
  const bg = document.createElement('div');
  bg.className = 'sheet-bg';
  bg.onclick = (e) => { if (e.target === bg) bg.remove(); };

  const sheet = document.createElement('div');
  sheet.className = 'sheet';

  const h = document.createElement('h3');
  h.textContent = opts.title;
  sheet.append(h);

  if (opts.hint) {
    const p = document.createElement('p');
    p.style.cssText = 'margin:0 0 12px;color:var(--muted);font-size:14px';
    p.textContent = opts.hint;
    sheet.append(p);
  }

  const input = document.createElement('input');
  input.className = 'field';
  input.type = opts.type || 'text';
  input.value = opts.value || '';
  sheet.append(input);

  const primary = document.createElement('button');
  primary.className = 'action';
  primary.style.width = '100%';
  primary.textContent = opts.confirm || 'Valider';
  primary.onclick = () => { const v = input.value; bg.remove(); opts.onConfirm(v); };
  sheet.append(primary);

  if (opts.secondary) {
    const sec = document.createElement('button');
    sec.className = 'action ghost';
    sec.style.cssText = 'width:100%;margin-top:8px';
    sec.textContent = opts.secondary.label;
    sec.onclick = () => { bg.remove(); opts.secondary.onClick(); };
    sheet.append(sec);
  }

  const cancel = document.createElement('button');
  cancel.className = 'action ghost';
  cancel.style.cssText = 'width:100%;margin-top:8px';
  cancel.textContent = 'Annuler';
  cancel.onclick = () => bg.remove();
  sheet.append(cancel);

  bg.append(sheet);
  document.body.append(bg);
  setTimeout(() => input.focus(), 60);
}

/* Saisie / modification du numero d'une personne, puis ouverture. */
function openNumberSheet(c) {
  const name = c.conversation;
  inputSheet({
    title: 'Numero de ' + name,
    hint: "Format international sans + : par ex. 33612345678 (33 = France). A saisir une seule fois, il sera memorise.",
    value: config.phones[name] || '',
    type: 'tel',
    confirm: 'Ouvrir la conversation',
    onConfirm: (v) => {
      const d = (v || '').replace(/\D/g, '');
      if (d) { config.phones[name] = d; save(); }
      Bridge.openChat(config.phones[name] || '');
    },
    secondary: {
      label: 'Ouvrir WhatsApp sans numero',
      onClick: () => Bridge.openChat('')
    }
  });
}

/* ------------------------------------------------------------------ */
/* Ouverture vers WhatsApp                                             */
/* ------------------------------------------------------------------ */

function open(c) {
  config.seen[c.conversation] = c.postTime;
  save();
  render();

  // Les groupes n'ont pas de lien direct : WhatsApp ne permet pas d'y entrer
  // depuis une autre app. On ouvre donc WhatsApp simplement.
  if (c.isGroup) { Bridge.openChat(''); return; }

  // Contact direct : si le numero est connu, on ouvre la conversation ;
  // sinon on le demande une fois via une saisie integree (fiable).
  if (config.phones[c.conversation]) {
    Bridge.openChat(config.phones[c.conversation]);
  } else {
    openNumberSheet(c);
  }
}

/* ------------------------------------------------------------------ */
/* Demarrage                                                           */
/* ------------------------------------------------------------------ */

function refresh() {
  messages = Bridge.getMessages() || [];
  render();
}

/* Appelee par MainActivity.onResume(), au retour depuis WhatsApp. */
window.onAppResume = function () {
  if (Bridge.isEnabled()) refresh();
};

function boot() {
  if (!Bridge.isEnabled()) {
    document.getElementById('tabs').style.display = 'none';
    document.getElementById('main').innerHTML = `<div class="panel">
      <h2>Accorder l'acces aux notifications</h2>
      <p>Triage lit les notifications de WhatsApp pour les repartir dans tes listes. Rien ne quitte ton telephone. Tu peux retirer cet acces a tout moment dans les reglages Android.</p>
      <button class="action" id="grant">Ouvrir les reglages</button>
    </div>`;
    document.getElementById('grant').onclick = () => Bridge.openSettings();
    return;
  }

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) refresh();
  });
  // Filet de securite : les notifications arrivent pendant que l'app est ouverte.
  setInterval(refresh, 4000);

  refresh();
}

document.getElementById('toggle-settings').onclick = () => {
  settingsOpen = !settingsOpen;
  document.getElementById('toggle-settings').textContent = settingsOpen ? 'Termine' : 'Listes';
  document.getElementById('screen-title').textContent = settingsOpen ? 'Listes' : 'Triage';
  render();
};

function escape(s) {
  return String(s).replace(/[&<>"]/g, ch =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
}

function clock(ts) {
  const d = new Date(ts);
  const today = new Date();
  if (d.toDateString() === today.toDateString()) {
    return d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
  }
  return d.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit' });
}

boot();
</script>
