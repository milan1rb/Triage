<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Triage</title>
<style>
  :root {
    --paper:#f0f2f5; --surface:#ffffff; --ink:#111b21; --muted:#667781;
    --line:#e9edef; --chip:#eff2f5; --hover:#f5f6f6;
    --green:#25d366; --green-deep:#008069; --green-soft:#d9fdd3;
    --radius:10px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper:#0b141a; --surface:#111b21; --ink:#e9edef; --muted:#8696a0;
      --line:#222d34; --chip:#202c33; --hover:#182229;
      --green:#00a884; --green-deep:#00a884; --green-soft:#103529;
    }
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0;
    background: var(--surface);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 16px; line-height: 1.4;
    padding-bottom: env(safe-area-inset-bottom);
  }

  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--green-deep); outline-offset: 2px; }

  /* ---------- en-tete + onglets ---------- */
  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    padding-top: env(safe-area-inset-top);
  }
  .bar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px 8px;
  }
  .bar h1 { margin: 0; font-size: 21px; font-weight: 700; color: var(--green-deep); letter-spacing: -0.01em; }
  .bar button { font-size: 14px; font-weight: 600; color: var(--green-deep); }

  .tabs {
    display: flex; gap: 8px; overflow-x: auto;
    padding: 4px 12px 10px; scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }

  .tab {
    flex: 0 0 auto; display: flex; align-items: center; gap: 6px;
    padding: 6px 13px; border-radius: 16px;
    background: var(--chip); color: var(--muted); font-size: 14px;
  }
  .bar-actions { display: flex; align-items: center; gap: 6px; }
  #sort-btn { font-size: 20px; color: var(--green-deep); padding: 2px 8px; }
  #sort-btn.active { background: var(--green-soft); border-radius: 14px; }
  .search-wrap { padding: 2px 12px 8px; }
  #search {
    width: 100%; padding: 9px 14px; border-radius: 20px;
    border: 0; background: var(--chip); color: var(--ink); font-size: 15px;
  }
  #search::placeholder { color: var(--muted); }
  .sub-list { font-size: 12px; font-style: italic; color: var(--muted); margin-top: 2px; }
  .section-head {
    font-size: 12px; font-weight: 700; color: var(--muted);
    text-transform: uppercase; letter-spacing: .04em;
    padding: 12px 14px 4px; background: var(--surface);
  }
  .mute-ico { font-size: 13px; color: var(--muted); }
  .tab[aria-selected="true"] { background: var(--green-soft); color: var(--green-deep); font-weight: 600; }
  .tab-sep { flex: 0 0 auto; align-self: center; color: var(--muted); opacity: .5; font-weight: 700; font-size: 18px; padding: 0 1px; user-select: none; }

  .count {
    min-width: 18px; height: 18px; padding: 0 5px;
    border-radius: 9px; font-size: 11px; font-weight: 700;
    display: grid; place-items: center;
  }
  .count.on  { background: var(--green); color: #fff; }
  .count.off { background: transparent; color: var(--muted); border: 1px solid var(--line); }

  /* ---------- liste facon WhatsApp ---------- */
  main { padding: 0 0 90px; }

  .row {
    display: flex; gap: 13px; align-items: center;
    width: 100%; text-align: left;
    background: var(--surface);
    padding: 9px 14px;
    border-bottom: 1px solid var(--line);
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  .row:active { background: var(--hover); }

  .avatar {
    width: 49px; height: 49px; border-radius: 50%; flex: 0 0 auto;
    display: grid; place-items: center;
    color: #fff; font-weight: 600; font-size: 18px;
  }

  .row-main { flex: 1; min-width: 0; }
  .name {
    font-weight: 500; font-size: 17px; color: var(--ink);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .unread .name { font-weight: 600; }
  .preview {
    font-size: 14.5px; color: var(--muted); margin-top: 3px;
    display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden;
  }

  .meta { display: flex; flex-direction: column; align-items: flex-end; gap: 7px; flex: 0 0 auto; }
  .time { font-size: 12px; color: var(--muted); }
  .unread .time { color: var(--green); font-weight: 600; }

  .badge-green {
    min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px;
    background: var(--green); color: #fff; font-size: 12px; font-weight: 700;
    display: grid; place-items: center;
  }

  .add-btn {
    width: 30px; height: 30px; border-radius: 50%;
    background: var(--chip); color: var(--green-deep);
    font-size: 21px; line-height: 1; display: grid; place-items: center;
  }
  .add-btn:active { background: var(--line); }

  .tag {
    font-size: 11px; font-weight: 600; color: var(--green-deep);
    background: var(--green-soft);
    padding: 1px 7px; border-radius: 9px; display: inline-block;
  }

  /* ---------- etats vides / reglages ---------- */
  .panel { background: var(--surface); border-radius: var(--radius); padding: 22px 18px; margin: 12px; }
  .panel h2 { margin: 0 0 8px; font-size: 17px; font-weight: 600; }
  .panel p { margin: 0 0 14px; color: var(--muted); font-size: 15px; }

  .action { background: var(--green-deep); color: #fff; padding: 11px 16px; border-radius: 22px; font-weight: 600; font-size: 15px; }
  .action.ghost { background: var(--chip); color: var(--ink); }

  .field { width: 100%; padding: 10px 12px; margin-bottom: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); }

  .list-edit { border-top: 1px solid var(--line); padding: 16px 0 4px; }
  .list-edit:first-of-type { border-top: 0; }
  .swatches { display: flex; gap: 8px; margin: 10px 0 12px; }
  .swatch { width: 26px; height: 26px; border-radius: 50%; border: 2px solid transparent; }
  .swatch[aria-pressed="true"] { border-color: var(--ink); }
  .subhead { font-size: 13px; font-weight: 600; color: var(--muted); margin: 14px 0 2px; text-transform: uppercase; letter-spacing: .03em; }

  .pick-wrap { max-height: 42vh; overflow: auto; margin: 4px 0 8px; border: 1px solid var(--line); border-radius: 8px; }
  .pick { display: flex; align-items: center; gap: 11px; width: 100%; text-align: left; padding: 11px 12px; border-top: 1px solid var(--line); }
  .pick:first-child { border-top: 0; }
  .pick .box { width: 22px; height: 22px; flex: 0 0 auto; border: 2px solid var(--line); border-radius: 6px; display: grid; place-items: center; font-size: 14px; color: #fff; }
  .pick[aria-pressed="true"] .box { background: var(--green-deep); border-color: var(--green-deep); }
  .pick .pname { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
  .pick-empty { color: var(--muted); font-size: 14px; padding: 12px; }

  .sheet-bg { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; }
  .sheet { width: 100%; background: var(--surface); border-radius: 16px 16px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); max-height: 80vh; overflow: auto; }
  .sheet h3 { margin: 0 0 6px; font-size: 16px; font-weight: 600; }
  .sheet .opt { display: flex; align-items: center; gap: 11px; width: 100%; text-align: left; padding: 13px 6px; border-top: 1px solid var(--line); font-size: 16px; color: var(--ink); }
  .sheet .opt:active { background: var(--hover); }
  .swatch-dot { width: 14px; height: 14px; border-radius: 50%; flex: 0 0 auto; }

  /* gestion des listes : lignes compactes reordonnables */
  .mrow {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 2px; border-top: 1px solid var(--line);
  }
  .mrow.dragging { opacity: .55; background: var(--hover); }
  .drag {
    flex: 0 0 auto; touch-action: none; cursor: grab;
    color: var(--muted); font-size: 20px; line-height: 1; padding: 4px 6px;
  }
  .mrow .field { margin: 0; flex: 1; }
  .mini {
    flex: 0 0 auto; padding: 7px 12px; border-radius: 18px;
    background: var(--chip); color: var(--ink); font-size: 14px; font-weight: 600;
  }
  .mini.danger { color: #c0392b; }
  .mrow-label { flex: 1; min-width: 0; font-weight: 500; color: var(--muted); }
</style>
</head>
<body>

<header>
  <div class="bar">
    <h1 id="screen-title">Triage</h1>
    <div class="bar-actions">
      <button id="sort-btn" aria-label="Trier">&#8645;</button>
      <button id="toggle-settings">Listes</button>
    </div>
  </div>
  <div class="search-wrap" id="search-wrap">
    <input id="search" type="search" placeholder="Rechercher un contact" autocomplete="off" />
  </div>
  <div class="tabs" id="tabs" role="tablist"></div>
</header>

<main id="main"></main>

<script>
/* ------------------------------------------------------------------ */
/* Pont natif                                                          */
/* ------------------------------------------------------------------ */

/* Sur le telephone, Android expose window.AndroidBridge.
   Dans un navigateur, on bascule sur des conversations factices pour
   pouvoir travailler l'interface sans reinstaller l'APK. */

const Bridge = window.AndroidBridge ? {
  isEnabled:     () => AndroidBridge.isEnabled(),
  openSettings:  () => AndroidBridge.openSettings(),
  getMessages:   () => JSON.parse(AndroidBridge.getMessages() || '[]'),
  clearMessages: () => AndroidBridge.clearMessages(),
  openChat:      p  => AndroidBridge.openChat(p || ''),
  overlayAllowed:() => AndroidBridge.overlayAllowed(),
  requestOverlay:() => AndroidBridge.requestOverlay(),
  showBubble:    () => AndroidBridge.showBubble(),
  hideBubble:    () => AndroidBridge.hideBubble(),
  contactsAllowed:() => AndroidBridge.contactsAllowed(),
  requestContacts:() => AndroidBridge.requestContacts(),
  lookupNumber:  n  => AndroidBridge.lookupNumber(n || '')
} : demoBridge();

function demoBridge() {
  const now = Date.now(), min = 60000;
  const messages = [
    { id:'1', conversation:'Marie Lambert',   sender:'Marie Lambert',   text:"Bonjour, oui je suis interessee, on peut en parler ?", isGroup:false, postTime: now - 4*min },
    { id:'2', conversation:'Antoine Ferrand', sender:'Antoine Ferrand', text:'Pas disponible avant la semaine prochaine',            isGroup:false, postTime: now - 41*min },
    { id:'3', conversation:'Famille',         sender:'Papa',            text:'On vous attend dimanche midi',                         isGroup:true,  postTime: now - 92*min },
    { id:'4', conversation:'Sophie Renaud',   sender:'Sophie Renaud',   text:'Vous pouvez me renvoyer le document ?',                isGroup:false, postTime: now - 180*min },
    { id:'5', conversation:'Asso Rando',      sender:'Claire',          text:'Sortie annulee, trop de pluie annoncee',               isGroup:true,  postTime: now - 1560*min },
    { id:'6', conversation:'Karim Belaid',    sender:'Karim Belaid',    text:'Merci pour votre message',                             isGroup:false, postTime: now - 1800*min }
  ];
  return {
    isEnabled:     () => true,
    openSettings:  () => {},
    getMessages:   () => messages,
    clearMessages: () => { messages.length = 0; },
    openChat:      p  => alert(p ? 'Ouvrirait WhatsApp sur ' + p : 'Ouvrirait WhatsApp'),
    overlayAllowed:() => false,
    requestOverlay:() => alert("Autoriser l'affichage par-dessus les autres apps"),
    showBubble:    () => {},
    hideBubble:    () => {},
    contactsAllowed:() => false,
    requestContacts:() => alert("Autoriser l'acces aux contacts"),
    lookupNumber:  () => ''
  };
}

/* ------------------------------------------------------------------ */
/* Etat                                                                */
/* ------------------------------------------------------------------ */

const COLORS = ['#2f6fed', '#0f8a5f', '#b4471f', '#7b4bc4', '#0f7b8a', '#9c6b1f'];

const defaults = {
  lists: [],
  manual: [],       // contacts epingles manuellement
  muted: [],        // contacts en sourdine (captes mais sans ping/non-lu)
  bubble: true,     // bulle de retour rapide
  useContacts: false, // liaison au repertoire pour trouver les numeros
  showUnread: true, // afficher l'onglet Non lus
  sort: 'recent',   // recent | oldest | unread | az
  splitGroups: false, // separer groupes et contacts
  seen: {},
  phones: {}
};

const config = load();
let messages = [];
let active = 'unread';      // on arrive toujours sur les non-lus
let settingsOpen = false;
let searchQuery = '';

function load() {
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem('triage') || '{}'); } catch {}

  // Migration depuis l'ancienne version (dossiers a mots-cles -> listes manuelles).
  if (!saved.lists && Array.isArray(saved.folders)) {
    saved.lists = saved.folders.map(f => ({
      id: f.id, name: f.name, color: f.color, members: []
    }));
  }
  delete saved.folders;
  delete saved.defaultFolder;

  const cfg = { ...defaults, ...saved };
  if (!Array.isArray(cfg.lists)) cfg.lists = defaults.lists.map(l => ({ ...l }));
  cfg.lists.forEach(l => { if (!Array.isArray(l.members)) l.members = []; });
  cfg.seen = cfg.seen || {};
  cfg.phones = cfg.phones || {};
  cfg.manual = Array.isArray(cfg.manual) ? cfg.manual : [];
  cfg.muted = Array.isArray(cfg.muted) ? cfg.muted : [];
  if (!cfg.sort) cfg.sort = 'recent';
  return cfg;
}
function save() {
  localStorage.setItem('triage', JSON.stringify(config));
}

/* ------------------------------------------------------------------ */
/* Regroupement des notifications en conversations                     */
/* ------------------------------------------------------------------ */

function conversations() {
  const byName = new Map();
  for (const m of messages) {
    const current = byName.get(m.conversation);
    if (!current || m.postTime > current.postTime) {
      byName.set(m.conversation, m);
    }
  }
  // Contacts epingles : toujours affiches, meme sans notification (ex. discussion avec soi-meme).
  for (const mc of (config.manual || [])) {
    if (!byName.has(mc.name)) {
      byName.set(mc.name, {
        conversation: mc.name, sender: mc.name,
        text: mc.note || 'Contact epingle',
        isGroup: false, postTime: 0, manual: true
      });
    }
  }
  // Epingles en haut, le reste par date decroissante.
  return [...byName.values()].sort((a, b) => {
    const pa = a.manual ? 1 : 0, pb = b.manual ? 1 : 0;
    if (pa !== pb) return pb - pa;
    return b.postTime - a.postTime;
  });
}

/* Une entree de config.lists peut etre un vrai onglet ou un separateur "|". */
function isSeparator(l) {
  return l.separator === true || String(l.name).trim() === '|';
}
function listsOf(name) {
  return config.lists.filter(l => !isSeparator(l) && l.members.includes(name));
}
function primaryList(name) {
  return listsOf(name)[0] || null;
}
function inAnyList(name) {
  return config.lists.some(l => !isSeparator(l) && l.members.includes(name));
}

function isMuted(name) { return (config.muted || []).includes(name); }

function isUnread(c) {
  if (isMuted(c.conversation)) return false; // sourdine : capte mais pas de ping/non-lu
  return c.postTime > (config.seen[c.conversation] || 0);
}

/* Nombre de messages non lus d'une conversation (pour la pastille verte). */
function unreadCount(c) {
  const s = config.seen[c.conversation] || 0;
  return messages.filter(m => m.conversation === c.conversation && m.postTime > s).length;
}

/* Avatar : initiales + couleur derivee du nom. */
const AVATAR_COLORS = ['#e17076','#7bc862','#65aadd','#a695e7','#ee7aae','#6ec9cb','#f2a25c','#d98c8c'];
function initials(name) {
  const parts = String(name).trim().split(/\s+/).filter(Boolean);
  if (!parts.length) return '?';
  let s = parts[0][0] || '';
  if (parts.length > 1) s += parts[1][0] || '';
  return s.toUpperCase();
}
function avatarColor(name) {
  let h = 0;
  for (const ch of String(name)) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return AVATAR_COLORS[h % AVATAR_COLORS.length];
}

/* ------------------------------------------------------------------ */
/* Rendu                                                               */
/* ------------------------------------------------------------------ */

function firstTab() {
  if (config.showUnread !== false) return 'unread';
  const l = config.lists.find(x => !isSeparator(x));
  if (l) return l.id;
  return 'unsorted';
}

function normalizeActive() {
  if (active === 'unread') {
    if (config.showUnread === false) active = firstTab();
    return;
  }
  const all = conversations();
  if (active === 'unsorted') {
    const has = all.some(c => !c.isGroup && !inAnyList(c.conversation));
    if (!has) active = firstTab();
    return;
  }
  // Un onglet de liste doit exister et ne pas etre un separateur.
  const l = config.lists.find(x => x.id === active && !isSeparator(x));
  if (!l) active = firstTab();
}

function render() {
  normalizeActive();
  renderTabs();
  document.getElementById('main').innerHTML = '';
  if (settingsOpen) return renderSettings();
  renderList();
}

function makeTab(id, label, unread, total) {
  const btn = document.createElement('button');
  btn.className = 'tab';
  btn.role = 'tab';
  btn.setAttribute('aria-selected', active === id);
  btn.innerHTML = `<span>${escape(label)}</span>`;
  // Pastille verte uniquement s'il y a des messages non lus dans cet onglet.
  if (unread > 0) {
    const badge = document.createElement('span');
    badge.className = 'count on';
    badge.textContent = unread > 99 ? '99+' : unread;
    btn.append(badge);
  }
  btn.onclick = () => { active = id; render(); };
  return btn;
}

function renderTabs() {
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = '';
  const sw = document.getElementById('search-wrap');
  const sb = document.getElementById('sort-btn');
  if (settingsOpen) {
    tabs.style.display = 'none';
    if (sw) sw.style.display = 'none';
    if (sb) sb.style.display = 'none';
    return;
  }
  tabs.style.display = 'flex';
  if (sw) sw.style.display = 'block';
  if (sb) { sb.style.display = ''; sb.className = (config.sort !== 'recent' || config.splitGroups) ? 'active' : ''; }

  const all = conversations();
  const unreadAll = all.filter(isUnread).length;

  // Non lus (optionnel)
  if (config.showUnread !== false) {
    tabs.append(makeTab('unread', 'Non lus', unreadAll, unreadAll));
  }

  // Listes editables et separateurs "|"
  for (const l of config.lists) {
    if (isSeparator(l)) {
      const sep = document.createElement('span');
      sep.className = 'tab-sep';
      sep.textContent = '|';
      sep.setAttribute('aria-hidden', 'true');
      tabs.append(sep);
      continue;
    }
    const inList = all.filter(c => l.members.includes(c.conversation));
    const unread = inList.filter(isUnread).length;
    tabs.append(makeTab(l.id, l.name, unread, inList.length));
  }

  // A classer : contacts directs non ranges — masque si tout est classe
  const unsorted = all.filter(c => !c.isGroup && !inAnyList(c.conversation));
  if (unsorted.length > 0) {
    const unsortedUnread = unsorted.filter(isUnread).length;
    tabs.append(makeTab('unsorted', 'A classer', unsortedUnread, unsorted.length));
  }
}

function sortRows(rows) {
  const s = config.sort || 'recent';
  const arr = rows.slice();
  if (s === 'az') arr.sort((a, b) => a.conversation.localeCompare(b.conversation, 'fr'));
  else if (s === 'oldest') arr.sort((a, b) => a.postTime - b.postTime);
  else if (s === 'unread') arr.sort((a, b) => (isUnread(b) ? 1 : 0) - (isUnread(a) ? 1 : 0) || b.postTime - a.postTime);
  else arr.sort((a, b) => b.postTime - a.postTime);
  return arr;
}

/* Appui long sur une ligne -> menu contextuel, sans declencher l'ouverture. */
function attachLongPress(el, cb) {
  let timer = null, longFired = false, sx = 0, sy = 0;
  el.addEventListener('pointerdown', (e) => {
    longFired = false; sx = e.clientX; sy = e.clientY;
    timer = setTimeout(() => { longFired = true; cb(); }, 500);
  });
  const cancel = () => { if (timer) { clearTimeout(timer); timer = null; } };
  el.addEventListener('pointermove', (e) => {
    if (Math.abs(e.clientX - sx) > 10 || Math.abs(e.clientY - sy) > 10) cancel();
  });
  el.addEventListener('pointerup', cancel);
  el.addEventListener('pointercancel', cancel);
  el.addEventListener('pointerleave', cancel);
  el.addEventListener('click', (e) => {
    if (longFired) { e.stopPropagation(); e.preventDefault(); longFired = false; }
  }, true);
}

/* Menu contextuel d'une discussion (appui long). */
function openRowMenu(c) {
  const name = c.conversation;
  const bg = document.createElement('div');
  bg.className = 'sheet-bg';
  bg.onclick = (e) => { if (e.target === bg) bg.remove(); };
  const sheet = document.createElement('div');
  sheet.className = 'sheet';
  const h = document.createElement('h3');
  h.textContent = name;
  sheet.append(h);

  const opt = (label, fn) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.innerHTML = `<span style="flex:1">${escape(label)}</span>`;
    b.onclick = () => { bg.remove(); fn(); };
    sheet.append(b);
  };

  opt('Ouvrir la conversation', () => open(c));
  opt(isMuted(name) ? 'Reactiver les notifications' : 'Mettre en sourdine', () => {
    if (isMuted(name)) config.muted = config.muted.filter(n => n !== name);
    else config.muted.push(name);
    save(); render();
  });
  opt('Ranger dans une liste', () => openAssignSheet(name));

  const cancel = document.createElement('button');
  cancel.className = 'opt';
  cancel.style.color = 'var(--muted)';
  cancel.innerHTML = `<span style="flex:1">Annuler</span>`;
  cancel.onclick = () => bg.remove();
  sheet.append(cancel);

  bg.append(sheet);
  document.body.append(bg);
}

/* Construit une ligne de discussion. opts.mode 'search' affiche la liste en gris. */
function buildRow(c, opts) {
  opts = opts || {};
  const unread = isUnread(c);
  const muted = isMuted(c.conversation);
  const row = document.createElement('div');
  row.className = 'row' + (unread ? ' unread' : '');

  const av = document.createElement('div');
  av.className = 'avatar';
  av.style.background = avatarColor(c.conversation);
  av.textContent = initials(c.conversation);
  av.onclick = () => { if (c.isGroup) open(c); else openNumberSheet(c); };

  const col = document.createElement('div');
  col.className = 'row-main';

  const nameLine = escape(c.conversation) + (muted ? ' <span class="mute-ico">&#128263;</span>' : '');

  let extra = '';
  if (opts.mode === 'search') {
    const ls = listsOf(c.conversation).map(l => l.name);
    const label = c.isGroup ? 'Groupe' : (ls.length ? ls.join(', ') : 'A classer');
    extra = `<div class="sub-list">${escape(label)}</div>`;
  } else if (active === 'unread') {
    const tags = listsOf(c.conversation).map(l => `<span class="tag">${escape(l.name)}</span>`).join(' ');
    if (tags) extra = `<div style="margin-top:5px">${tags}</div>`;
  }

  col.innerHTML = `
    <div class="name">${nameLine}</div>
    <div class="preview">${escape(c.isGroup ? c.sender + ' : ' + c.text : c.text)}</div>
    ${extra}`;
  col.onclick = () => open(c);

  const meta = document.createElement('div');
  meta.className = 'meta';
  const time = document.createElement('div');
  time.className = 'time';
  time.textContent = c.postTime ? clock(c.postTime) : '';
  meta.append(time);

  if (opts.mode !== 'search' && active === 'unread' && !inAnyList(c.conversation)) {
    const add = document.createElement('button');
    add.className = 'add-btn';
    add.textContent = '+';
    add.setAttribute('aria-label', 'Ranger dans une liste');
    add.onclick = (e) => { e.stopPropagation(); openAssignSheet(c.conversation); };
    meta.append(add);
  } else if (unread) {
    const n = unreadCount(c) || 1;
    const badge = document.createElement('div');
    badge.className = 'badge-green';
    badge.textContent = n > 99 ? '99+' : n;
    meta.append(badge);
  }

  row.append(av, col, meta);
  attachLongPress(row, () => openRowMenu(c));
  return row;
}

function addSection(main, label) {
  const h = document.createElement('div');
  h.className = 'section-head';
  h.textContent = label;
  main.append(h);
}

function renderList() {
  const main = document.getElementById('main');
  const all = conversations();

  // Mode recherche : filtre global sur le nom.
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    const found = sortRows(all.filter(c => c.conversation.toLowerCase().includes(q)));
    if (!found.length) {
      main.innerHTML = `<div class="panel"><h2>Aucun resultat</h2><p>Aucun contact ne correspond a « ${escape(searchQuery)} ».</p></div>`;
      return;
    }
    for (const c of found) main.append(buildRow(c, { mode: 'search' }));
    return;
  }

  let rows = all.filter(c => {
    if (active === 'unread')   return isUnread(c);
    if (active === 'unsorted') return !c.isGroup && !inAnyList(c.conversation);
    const l = config.lists.find(x => x.id === active);
    return l ? l.members.includes(c.conversation) : false;
  });

  if (!rows.length) {
    let msg;
    if (active === 'unread') {
      msg = "Aucun message non lu. Une discussion revient ici des qu'un nouveau message arrive, et disparait une fois lue.";
    } else if (active === 'unsorted') {
      msg = "Aucun contact direct pour l'instant. Un contact s'ajoute ici des qu'il t'ecrit ; range-le ensuite dans une liste.";
    } else {
      msg = "Rien ici pour l'instant. Ajoute des discussions a cette liste depuis le bouton Listes.";
    }
    main.innerHTML = `<div class="panel"><h2>Rien a afficher</h2><p>${msg}</p></div>`;
    return;
  }

  rows = sortRows(rows);

  if (config.splitGroups) {
    const contacts = rows.filter(c => !c.isGroup);
    const groups = rows.filter(c => c.isGroup);
    if (contacts.length) { addSection(main, 'Contacts'); for (const c of contacts) main.append(buildRow(c)); }
    if (groups.length) { addSection(main, 'Groupes'); for (const c of groups) main.append(buildRow(c)); }
  } else {
    for (const c of rows) main.append(buildRow(c));
  }
}

/* Reordonnancement par glisser de la poignee (pointer events, tactile). */
function enableDrag(container) {
  let dragging = null;
  container.querySelectorAll('.mrow').forEach(row => {
    const handle = row.querySelector('.drag');
    if (!handle) return;
    handle.onpointerdown = (e) => {
      e.preventDefault();
      dragging = row;
      row.classList.add('dragging');
      try { handle.setPointerCapture(e.pointerId); } catch (err) {}
    };
    handle.onpointermove = (e) => {
      if (!dragging) return;
      const y = e.clientY;
      const rows = [...container.querySelectorAll('.mrow')];
      for (const r of rows) {
        if (r === dragging) continue;
        const rect = r.getBoundingClientRect();
        if (y > rect.top && y < rect.bottom) {
          if (y < rect.top + rect.height / 2) container.insertBefore(dragging, r);
          else container.insertBefore(dragging, r.nextSibling);
          break;
        }
      }
    };
    const end = () => {
      if (!dragging) return;
      dragging.classList.remove('dragging');
      dragging = null;
      const order = [...container.querySelectorAll('.mrow')].map(r => r.dataset.id);
      config.lists.sort((a, b) => order.indexOf(a.id) - order.indexOf(b.id));
      save(); renderTabs();
    };
    handle.onpointerup = end;
    handle.onpointercancel = end;
  });
}

/* Feuille "Gerer les contacts" d'une liste. */
function openManageContacts(l) {
  const bg = document.createElement('div');
  bg.className = 'sheet-bg';
  bg.onclick = (e) => { if (e.target === bg) { bg.remove(); renderSettings(); } };
  const sheet = document.createElement('div');
  sheet.className = 'sheet';

  const h = document.createElement('h3');
  h.textContent = 'Contacts de ' + l.name;
  sheet.append(h);

  const wrap = document.createElement('div');
  wrap.className = 'pick-wrap';
  const fill = () => {
    wrap.innerHTML = '';
    const list = conversations();
    if (!list.length) {
      wrap.innerHTML = `<div class="pick-empty">Aucun contact disponible. Ils apparaitront des qu'un message arrivera, ou ajoute-en un par numero ci-dessous.</div>`;
      return;
    }
    for (const c of list) {
      const inList = l.members.includes(c.conversation);
      const item = document.createElement('button');
      item.className = 'pick';
      item.setAttribute('aria-pressed', inList);
      item.innerHTML = `<span class="box">${inList ? '&#10003;' : ''}</span><span class="pname">${escape(c.conversation)}</span>`;
      item.onclick = () => {
        if (l.members.includes(c.conversation)) l.members = l.members.filter(n => n !== c.conversation);
        else l.members.push(c.conversation);
        save(); fill(); renderTabs();
      };
      wrap.append(item);
    }
  };
  fill();
  sheet.append(wrap);

  const addByNum = document.createElement('button');
  addByNum.className = 'action ghost';
  addByNum.style.width = '100%';
  addByNum.textContent = 'Ajouter un contact par numero';
  addByNum.onclick = () => {
    bg.remove();
    addManualContact('', 'Contact epingle', (name) => {
      if (!l.members.includes(name)) l.members.push(name);
      save(); render();
    });
  };
  sheet.append(addByNum);

  const done = document.createElement('button');
  done.className = 'action';
  done.style.cssText = 'width:100%;margin-top:8px';
  done.textContent = 'Termine';
  done.onclick = () => { bg.remove(); renderSettings(); };
  sheet.append(done);

  bg.append(sheet);
  document.body.append(bg);
}

/* Ajout d'un contact epingle (nom puis numero). */
function addManualContact(prefName, prefNote, onCreated) {
  inputSheet({
    title: 'Nom du contact',
    hint: "Le nom qui s'affichera dans la liste.",
    value: prefName || '',
    confirm: 'Suivant',
    onConfirm: (nm) => {
      const name = (nm || '').trim();
      if (!name) return;
      inputSheet({
        title: 'Numero de ' + name,
        hint: "Format international sans + : 33612345678. Laisse vide si pas d'ouverture directe.",
        type: 'tel',
        confirm: 'Ajouter',
        onConfirm: (ph) => {
          const d = (ph || '').replace(/\D/g, '');
          config.manual = config.manual || [];
          if (!config.manual.some(x => x.name === name)) config.manual.push({ name, note: prefNote || 'Contact epingle' });
          if (d) config.phones[name] = d;
          save(); render();
          if (onCreated) onCreated(name);
        }
      });
    }
  });
}

    confirm: 'Ouvrir la conversation',
    onConfirm: (v) => {
      const d = (v || '').replace(/\D/g, '');
      if (d) { config.phones[name] = d; save(); }
      launchChat(config.phones[name] || '');
    },
    secondary: {
      label: 'Ouvrir WhatsApp sans numero',
      onClick: () => launchChat('')
    }
  });
}

/* ------------------------------------------------------------------ */
/* Ouverture vers WhatsApp                                             */
/* ------------------------------------------------------------------ */

function open(c) {
  config.seen[c.conversation] = c.postTime;
  save();
  render();

  // Les groupes n'ont pas de lien direct : WhatsApp ne permet pas d'y entrer
  // depuis une autre app. On ouvre donc WhatsApp simplement.
  if (c.isGroup) { launchChat(''); return; }

  // Contact direct : si le numero est connu, on ouvre la conversation.
  if (config.phones[c.conversation]) {
    launchChat(config.phones[c.conversation]);
    return;
  }
  // Sinon, si le repertoire est lie, on tente de trouver le numero par le nom.
  if (config.useContacts && Bridge.contactsAllowed && Bridge.contactsAllowed()) {
    let num = '';
    try { num = Bridge.lookupNumber(c.conversation) || ''; } catch (e) {}
    if (num) { config.phones[c.conversation] = num; save(); launchChat(num); return; }
  }
  // En dernier recours, on demande le numero une fois (saisie integree).
  openNumberSheet(c);
}

/* ------------------------------------------------------------------ */
/* Demarrage                                                           */
/* ------------------------------------------------------------------ */

function refresh() {
  messages = Bridge.getMessages() || [];
  render();
}

/* Appelee par MainActivity.onResume(), au retour depuis WhatsApp. */
window.onAppResume = function () {
  if (Bridge.hideBubble) { try { Bridge.hideBubble(); } catch (e) {} }
  if (Bridge.isEnabled()) refresh();
};

function boot() {
  if (!Bridge.isEnabled()) {
    document.getElementById('tabs').style.display = 'none';
    document.getElementById('main').innerHTML = `<div class="panel">
      <h2>Accorder l'acces aux notifications</h2>
      <p>Triage lit les notifications de WhatsApp pour les repartir dans tes listes. Rien ne quitte ton telephone. Tu peux retirer cet acces a tout moment dans les reglages Android.</p>
      <button class="action" id="grant">Ouvrir les reglages</button>
    </div>`;
    document.getElementById('grant').onclick = () => Bridge.openSettings();
    return;
  }

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) refresh();
  });
  // Filet de securite : les notifications arrivent pendant que l'app est ouverte.
  setInterval(refresh, 4000);

  refresh();
}

document.getElementById('toggle-settings').onclick = () => {
  settingsOpen = !settingsOpen;
  document.getElementById('toggle-settings').textContent = settingsOpen ? 'Termine' : 'Listes';
  document.getElementById('screen-title').textContent = settingsOpen ? 'Reglages' : 'Triage';
  if (settingsOpen) { searchQuery = ''; const s = document.getElementById('search'); if (s) s.value = ''; }
  render();
};

document.getElementById('sort-btn').onclick = () => { if (!settingsOpen) openSortSheet(); };

document.getElementById('search').addEventListener('input', (e) => {
  searchQuery = (e.target.value || '').trim();
  if (!settingsOpen) renderList();
});

function escape(s) {
  return String(s).replace(/[&<>"]/g, ch =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
}

function clock(ts) {
  const d = new Date(ts);
  const today = new Date();
  if (d.toDateString() === today.toDateString()) {
    return d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
  }
  return d.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit' });
}

boot();
</script>
</body>
</html>
